name: CI

# One CI run per change. A branch push without a PR gets no run (open a PR, or use "Run workflow"); the push triggers exist only for the
# branches the Deploy workflow listens to (main, develop). `pull_request` has no base filter so a stacked PR (base = another branch) is checked too.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. A push to main/develop (or a manual run) gets its own per-commit group, so it is never
# cancelled or replaced by a newer run: the Deploy workflow starts from each of them. Keep the push branches below in sync with the
# `branches:` filters of the workflow_run triggers in deploy.yml and deploy-web.yml.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas a pull request touches, so an unrelated job is skipped (a skipped job counts as passing for a required check). Anything that is
  # not a pull_request, any shared/root change, an empty or failed diff: everything runs. Hand-rolled git diff, no third-party action (see deploy.yml).
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      user: ${{ steps.diff.outputs.user }}
      driver: ${{ steps.diff.outputs.driver }}
      admin: ${{ steps.diff.outputs.admin }}
      mobile: ${{ steps.diff.outputs.mobile }}
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          all() { for k in api user driver admin mobile code; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; }
          if [ "$EVENT" != "pull_request" ]; then all; exit 0; fi
          FILES=$(git diff --name-only "$BASE...$HEAD") || { echo "diff failed, running everything"; all; exit 0; }
          if [ -z "$FILES" ]; then echo "empty diff, running everything"; all; exit 0; fi
          printf '%s
' "$FILES"
          has() { printf '%s
' "$FILES" | grep -Eq "$1"; }
          SHARED='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|\.npmrc|\.nvmrc|patches/|packages/|\.github/workflows/ci\.yml|\.github/scripts/|eslint\.config|\.eslintrc|tsconfig|docker-compose)'
          flag() { if has "$SHARED" || has "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; echo "$1=true"; else echo "$1=false" >> "$GITHUB_OUTPUT"; echo "$1=false"; fi; }
          flag api    '^api/'
          flag user   '^apps/user/'
          flag driver '^apps/driver/'
          flag admin  '^apps/admin/'
          flag mobile '^apps/(rider-mobile|driver-mobile)/'
          # lint covers every workspace: needed whenever any code area changed (docs, infra and load-test changes skip it)
          if has "$SHARED" || has '^(api|apps)/'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Dependency CVEs get their own scan at CRITICAL-only: the monorepo
      # currently carries ~27 pre-existing HIGH-severity transitive findings
      # (mostly DoS-class, several in frontend packages unrelated to any
      # given change) that would block every PR indefinitely. Tracked as a
      # separate backlog item to triage properly, not gated here.
      # Pinned to a commit SHA, not a version tag -- trivy-action's own tags
      # were force-pushed in a March 2026 supply-chain attack.
      - name: Trivy - dependency vulnerabilities (CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"

      # Misconfig/secret scanning stays at CRITICAL+HIGH -- these are far
      # fewer, and the accepted-risk ones are suppressed inline
      # (#trivy:ignore:...) right where the resource lives, with reasoning.
      - name: Trivy - misconfig and secrets (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"

  # The API deploy runs migrations before flipping traffic and never undoes them, so a rollback
  # leaves the OLD release on the NEW schema. Migrations must be backward compatible
  # (expand/contract): see docs/OPS_RUNBOOK.md "Releases and rollbacks". Pull requests only.
  migration-check:
    name: Migration safety
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests for the CI scripts
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"
      - name: Check migrations added or changed by this PR
        run: python3 .github/scripts/migration_check.py --base "origin/${{ github.base_ref }}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  typecheck-api:
    name: Typecheck API
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ocar/api --config.dangerouslyAllowAllBuilds=true
      - run: pnpm --filter @ocar/api exec tsc --noEmit

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true') }}
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ocar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ocar/api --config.dangerouslyAllowAllBuilds=true

      - name: Create .env for migrations
        run: |
          cat > api/.env <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ocar_test
          REDIS_URL=redis://localhost:6379
          JWT_ACCESS_SECRET=test-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET=test-refresh-secret-at-least-32-chars
          JWT_ACCESS_EXPIRY=15m
          JWT_REFRESH_EXPIRY_USER=30d
          JWT_REFRESH_EXPIRY_ADMIN=24h
          TOTP_ENCRYPTION_KEY=abababababababababababababababababababababababababababababababab
          BANK_ACCOUNT_ENCRYPTION_KEY=abababababababababababababababababababababababababababababababab
          S3_BUCKET_NAME=test-bucket
          S3_REGION=ap-south-1
          S3_ACCESS_KEY=test-access-key
          S3_SECRET_KEY=test-secret-key
          EOF

      - name: Run migrations
        run: pnpm --filter @ocar/api migrate

      - name: Run tests
        run: pnpm --filter @ocar/api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ocar_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ocar_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY_USER: 30d
          JWT_REFRESH_EXPIRY_ADMIN: 24h
          TOTP_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
          BANK_ACCOUNT_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
          S3_BUCKET_NAME: test-bucket
          S3_REGION: ap-south-1
          S3_ACCESS_KEY: test-access-key
          S3_SECRET_KEY: test-secret-key
          # Online collections (ride fares, wallet top-ups, packages) go through
          # PayU: payments.service.ts branches to a dev-mode auto-confirm shortcut
          # (bypassing the return/webhook path entirely) whenever PAYU_KEY/PAYU_SALT
          # are empty, which would silently defeat M08's PayU return/webhook tests.
          # Dummy values — m08.test.ts mocks fetchPayuStatus, nothing hits PayU.
          # The URLs are https + non-localhost so they would also pass the
          # production boot guard (NODE_ENV is 'test' here, so it does not run).
          PAYU_KEY: test-payu-key
          PAYU_SALT: test-payu-salt
          PAYU_ENV: test
          API_BASE_URL: https://api.example.test
          USER_APP_URL: https://app.example.test
          DRIVER_APP_URL: https://driver.example.test
          # Razorpay remains for driver payouts and pre-cutover in-flight payments
          # (M08's legacy /webhook/razorpay idempotency test, payout tests). Dummy
          # values; never hit the network.
          RAZORPAY_KEY_ID: rzp_test_dummy_key_id
          RAZORPAY_KEY_SECRET: test-razorpay-key-secret
          RAZORPAY_WEBHOOK_SECRET: test_webhook_secret_123

  typecheck-user:
    name: Typecheck User App
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.user == 'true') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ocar/user
      - run: pnpm --filter @ocar/user exec tsc --noEmit

  typecheck-driver:
    name: Typecheck Driver App
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.driver == 'true') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ocar/driver
      - run: pnpm --filter @ocar/driver exec tsc --noEmit

  typecheck-admin:
    name: Typecheck Admin App
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.admin == 'true') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ocar/admin
      - run: pnpm --filter @ocar/admin exec tsc --noEmit
      - run: pnpm --filter @ocar/admin test

  typecheck-mobile:
    name: Typecheck Mobile Apps
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ocar/rider-mobile... --filter @ocar/driver-mobile...
      - run: pnpm --filter @ocar/mobile-shared exec tsc --noEmit
      - run: pnpm --filter @ocar/mobile-shared exec vitest run
      - run: pnpm --filter @ocar/rider-mobile exec tsc --noEmit
      - run: pnpm --filter @ocar/driver-mobile exec tsc --noEmit
      - run: pnpm --filter @ocar/driver-mobile exec vitest run

  # One check that is red if anything failed or was cancelled, and green when every job passed or was legitimately skipped. Use THIS as the
  # required status check in branch protection: a skipped job counts as passing, so requiring the individual jobs alone would let a broken
  # `changes` job skip the tests and still merge.
  ci-gate:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, security-scan, migration-check, lint, typecheck-api, test-api, typecheck-user, typecheck-driver, typecheck-admin, typecheck-mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | python3 -c "
          import json,sys
          bad={k:v['result'] for k,v in json.load(sys.stdin).items() if v['result'] in ('failure','cancelled')}
          print(bad or 'all jobs passed or were skipped by design')
          sys.exit(1 if bad else 0)"
