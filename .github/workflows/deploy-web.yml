name: Deploy Web (Vercel)

# Vercel's own Git integration blocks deployments when the commit author is not a
# seat on the Vercel team (single-seat plan, pushes come from another account).
# Deploying with a Vercel token from here avoids that check entirely: the deploy is
# attributed to the token's owner, not the commit author. Each app's vercel.json sets
# `git.deploymentEnabled: false` so the native integration stops posting failed checks.
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN                 account token (vercel.com/account/tokens), scope = the team
#   VERCEL_ORG_ID                team/org id (Team Settings > General, or .vercel/project.json "orgId")
#   VERCEL_PROJECT_ID_ADMIN      project id of ocar-monorepo-admin   (Project Settings > General)
#   VERCEL_PROJECT_ID_DRIVER     project id of ocar-monorepo-driver
#   VERCEL_PROJECT_ID_USER       project id of ocar-monorepo-user
# Env vars (NEXT_PUBLIC_*, VITE_*) stay in the Vercel projects; `vercel pull` fetches them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned (supply chain), not "latest".
  VERCEL_CLI_VERSION: 60.1.1

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs get no secrets anyway. Manual runs only deploy main.
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    concurrency:
      group: deploy-web-${{ matrix.app }}-${{ github.ref }}
      # Never cancel a production deploy half-way; superseded PR previews can be cancelled.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin
            project_secret: VERCEL_PROJECT_ID_ADMIN
          - app: driver
            project_secret: VERCEL_PROJECT_ID_DRIVER
          - app: user
            project_secret: VERCEL_PROJECT_ID_USER
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
      # push / manual run on main = production; pull requests = preview.
      TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Check Vercel secrets are configured
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (see the setup notes at the top of this workflow)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      # Build on Vercel, not on the runner. `vercel pull` + `vercel build` cannot read env
      # vars marked "Sensitive" in the project (it substitutes the literal text
      # "[SENSITIVE]"), which broke every NEXT_PUBLIC_* / VITE_* value baked into the
      # bundles (API URL, Firebase, Maps). A remote build resolves them server-side.
      # Run from the repo root so the project's monorepo Root Directory setting applies.
      - name: Deploy (remote build on Vercel)
        id: deploy
        run: |
          if [ "$TARGET" = "production" ]; then
            url=$(vercel deploy --yes --prod)
          else
            url=$(vercel deploy --yes)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.app }} (${TARGET})"
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      # Guard: fail the job if the placeholder ever ships again.
      - name: Verify no placeholder env values were baked in
        run: |
          url="${{ steps.deploy.outputs.url }}"
          html=$(curl -s --max-time 30 "$url" || true)
          # Deployment protection can answer previews with a login page; only fail on real content.
          if echo "$html" | grep -q "<html" && echo "$html" | grep -q "_next\|/assets/"; then
            scripts=$(echo "$html" | grep -o '"/[^"]*\.js"' | tr -d '"' | head -30)
            for s in $scripts; do
              if curl -s --max-time 30 "$url$s" | grep -q '\[SENSITIVE\]'; then
                echo "::error::Found the literal [SENSITIVE] placeholder in $s - a Sensitive env var was not resolved"; exit 1
              fi
            done
          fi
