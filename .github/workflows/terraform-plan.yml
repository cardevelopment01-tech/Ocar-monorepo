name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -var="environment=prod" -no-color -input=false > plan_output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const raw = fs.readFileSync('infra/terraform/plan_output.txt', 'utf8')
            // "X: Refreshing state..." lines are pure noise (one per resource,
            // never useful) and, worse, they're what pushed the real plan
            // output/error text (which prints AFTER the refresh phase) past
            // the truncation cutoff below on the first real run of this
            // workflow -- the error was silently dropped from the comment.
            const plan = raw.split('\n').filter(line => !line.includes(': Refreshing state...')).join('\n')
            const maxLen = 60000
            const body = plan.length > maxLen
              ? '... (truncated from the start, see workflow logs for full output)\n\n' + plan.slice(-maxLen)
              : plan

            const marker = '<!-- terraform-plan-comment -->'
            const comment = `${marker}\n### Terraform Plan\n\n\`\`\`\n${body}\n\`\`\``

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              })
            }

      - name: Fail if plan errored
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1
