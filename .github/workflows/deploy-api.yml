name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "docker-compose.prod.yml"
      - "infra/**"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ocar-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-push
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -e
            cd /home/ubuntu/Ocar-monorepo

            echo "$GHCR_TOKEN" | docker login ghcr.io -u cardevelopment01-tech --password-stdin

            export GITHUB_REPOSITORY_OWNER=cardevelopment01-tech
            export IMAGE_TAG=$IMAGE_TAG

            docker compose -f docker-compose.prod.yml pull api

            echo "Running migrations (new image, old container still serving traffic)..."
            docker run --rm --env-file .env.prod \
              ghcr.io/$GITHUB_REPOSITORY_OWNER/ocar-api:$IMAGE_TAG \
              node dist/db/migrate.js

            echo "Migrations OK — cutting over to new image"
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
