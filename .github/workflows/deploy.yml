name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  # workflow_run doesn't support `on.paths:` filtering (push/pull_request only)
  # -- so this job does it by hand: diff the exact commit CI just validated
  # against the last commit THIS WORKFLOW successfully deployed (not just
  # HEAD^) and skip build/deploy entirely if nothing that actually feeds the
  # Docker image changed since then. Otherwise every merge, even a
  # docs/Terraform-only one, would rebuild the image and restart the whole
  # ASG for no reason -- confirmed live: an infra/**-only PR (adding a new
  # IAM role, no app code touched) still triggered a real deploy under an
  # earlier version of this filter that included `infra/` and
  # `docker-compose.prod.yml`. Neither ever reaches the image -- checked
  # api/Dockerfile directly: it only COPYs pnpm-lock.yaml/pnpm-workspace.yaml/
  # package.json and api/. infra/** and docker-compose.prod.yml changes are
  # applied by a completely separate, manual `terraform apply`, not by this
  # workflow at all.
  #
  # Diffing against the last deployed SHA (via the Deploy workflow's own run
  # history) instead of HEAD^ is what makes this correct for a direct push of
  # multiple commits straight to main, not just a single-commit PR merge --
  # confirmed live: a 6-commit direct push to main where only the LAST commit
  # was docs-only caused HEAD^..HEAD to see just that one commit and report
  # "nothing relevant", silently skipping build/deploy for 5 preceding
  # commits that touched api/. Falls back to HEAD^ only when no prior
  # successful Deploy run exists (first run ever).
  changes:
    name: Detect relevant changes
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_SHA=$(gh run list --workflow=deploy.yml --status=success --branch=main --limit=1 --json headSha --jq '.[0].headSha' 2>/dev/null || echo "")
          if [ -z "$PREV_SHA" ] || ! git cat-file -e "$PREV_SHA" 2>/dev/null; then
            BASE="HEAD^"
          else
            BASE="$PREV_SHA"
          fi
          echo "Diffing $BASE..HEAD"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(api/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.github/workflows/deploy\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    name: Build & Push Docker Image
    needs: changes
    if: github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ocar-api
          # metadata-action's `version` output (used below as IMAGE_TAG, and
          # everywhere downstream: the image-tag SSM parameter, the migration
          # container, docker-compose.prod.yml's ${IMAGE_TAG} substitution) is
          # picked by type priority, not tag order -- type=raw defaults to a
          # HIGHER priority (200) than type=sha (100), so without an explicit
          # override `version` always resolved to "latest" even though the
          # sha tag was pushed correctly alongside it. That made every deploy
          # indistinguishable from the last, so the "Record previous image
          # tag" step below always saw PREV == IMAGE_TAG ("latest" == "latest")
          # and rollback's "is there a distinct previous tag" check was always
          # false -- see the P0 action item in
          # docs/INCIDENT_2026-08-25_PROD_DB_AUTH_OUTAGE.md. Explicit priority
          # makes the sha tag win instead; `latest` is still pushed as a
          # convenience tag for manual pulls, it just never drives anything
          # below this step.
          tags: |
            type=sha,prefix=sha-,format=short,priority=900
            type=raw,value=latest,enable={{is_default_branch}},priority=200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ASG (blue/green)
    needs: [changes, build-push]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
      PROJECT: ocar
      ENVIRONMENT: prod
      ACTIVE_COLOR_PARAM: /ocar/prod/active-color
      ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
      ALB_NAME: ocar-prod-alb
      BAKE_SECONDS: 600
      # Must stay a multiple of 60: HTTPCode_Target_5XX_Count is a
      # standard-resolution ALB metric, and CloudWatch's GetMetricStatistics
      # requires --period to be a multiple of 60 for standard-resolution
      # metrics -- a finer-grained value makes the bake-window query fail.
      BAKE_POLL_INTERVAL: 60
      MAX_5XX_PER_POLL: 5
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Read active color, compute idle color and resource names
        id: colors
        run: |
          set -e
          ACTIVE=$(aws ssm get-parameter --name "$ACTIVE_COLOR_PARAM" --query 'Parameter.Value' --output text)
          if [ "$ACTIVE" != "blue" ] && [ "$ACTIVE" != "green" ]; then
            echo "Unexpected active-color value: '$ACTIVE'" >&2
            exit 1
          fi
          if [ "$ACTIVE" = "blue" ]; then IDLE="green"; else IDLE="blue"; fi
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "idle=$IDLE" >> "$GITHUB_OUTPUT"
          echo "active_asg=${PROJECT}-${ENVIRONMENT}-asg-$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "idle_asg=${PROJECT}-${ENVIRONMENT}-asg-$IDLE" >> "$GITHUB_OUTPUT"
          echo "idle_tg_name=${PROJECT}-${ENVIRONMENT}-api-tg-$IDLE" >> "$GITHUB_OUTPUT"
          echo "active_tg_name=${PROJECT}-${ENVIRONMENT}-api-tg-$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "idle_image_tag_param=/${PROJECT}/${ENVIRONMENT}/$IDLE/image-tag" >> "$GITHUB_OUTPUT"
          echo "Active: $ACTIVE / Idle: $IDLE"

      - name: Find a running instance on the currently-active color (for migrations)
        id: instance
        run: |
          set -e
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:autoscaling:groupName,Values=${{ steps.colors.outputs.active_asg }}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "No running instance on the active color (${{ steps.colors.outputs.active_asg }}) -- can't route the migration command anywhere" >&2
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Run migrations (new image, current color still serving all traffic)
        env:
          # ocar-prod-db is Terraform's stable "${project_name}-${environment}-db"
          # identifier (infra/terraform/rds.tf) -- not a secret, doesn't rotate,
          # safe to hardcode here same as it is throughout rds.tf itself.
          DB_INSTANCE_ID: ocar-prod-db
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          set -e
          # DB host/port/name/user/secret-ARN are all queried live from RDS at
          # deploy time instead of being copied into a hand-maintained SSM
          # parameter -- see docs/INCIDENT_2026-08-25_PROD_DB_AUTH_OUTAGE.md for
          # why a copied value (the old migration-database-url parameter) went
          # stale and caused an outage. None of these values are secrets; the
          # actual password is fetched by migrate.js itself, inside the
          # container, directly from Secrets Manager via the instance's IAM role
          # (iam.tf's rds_secret_read policy) -- nothing sensitive crosses into
          # this workflow at all.
          DB_INFO=$(aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE_ID" \
            --query "DBInstances[0].{Host:Endpoint.Address,Port:Endpoint.Port,Name:DBName,User:MasterUsername,SecretArn:MasterUserSecret.SecretArn}" \
            --output json)
          DB_HOST=$(echo "$DB_INFO" | jq -r .Host)
          DB_PORT=$(echo "$DB_INFO" | jq -r .Port)
          DB_NAME=$(echo "$DB_INFO" | jq -r .Name)
          DB_USER=$(echo "$DB_INFO" | jq -r .User)
          DB_SECRET_ARN=$(echo "$DB_INFO" | jq -r .SecretArn)

          # Routed through SSM to a live instance on the active color instead
          # of a `docker run` on this GitHub-hosted runner -- RDS
          # (infra/terraform/rds.tf) isn't publicly reachable, only the EC2
          # instances' security group can reach it. api/entrypoint.sh also
          # runs migrate.js on every container start, so this ad-hoc run and
          # each instance's own boot both invoke it -- safe only because
          # migrate.js is idempotent (skips already-applied files,
          # pg_advisory_lock serializes concurrent runs). This run exists
          # solely to gate the rollout on migrations succeeding. --name
          # db_migrate keeps this container out of the ocar_* naming
          # convention cadvisor/Alloy filter on (infra/alloy/config.alloy) --
          # without it, cadvisor picked up a fresh randomly-named container on
          # every deploy and permanently inflated Grafana Cloud's
          # active-series count (2026-08-19 incident). --pull always: the
          # active color's instances have been running this same image tag
          # continuously and already have an old copy of a mutable tag cached
          # locally -- `docker run` does not re-pull an image that already
          # exists locally under the same tag, so without this flag the
          # migration container could silently run stale, pre-this-deploy
          # code (confirmed via a real deploy failure: DB_SECRET_ARN correctly
          # reached the container's shell env, but migrate.js still hit the
          # OLD code's "DATABASE_URL environment variable is not set" error,
          # meaning it never saw the DB_SECRET_ARN branch added in that
          # deploy at all). Brand-new instances at boot don't have this
          # problem -- they have nothing cached yet, so entrypoint.sh's own
          # migrate.js run is unaffected.
          cat > /tmp/ssm-commands.json <<EOF
          {
            "commands": [
              "docker run --rm --pull always --name db_migrate -e DB_HOST=$DB_HOST -e DB_PORT=$DB_PORT -e DB_NAME=$DB_NAME -e DB_USER=$DB_USER -e DB_SECRET_ARN=$DB_SECRET_ARN -e AWS_REGION=$AWS_REGION --entrypoint node ghcr.io/${{ github.repository_owner }}/ocar-api:$IMAGE_TAG dist/db/migrate.js"
            ]
          }
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ocar-api migration for $IMAGE_TAG" \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' --output text)

          for i in $(seq 1 30); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success)
                echo "Migrations applied."
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Migration command failed with status $STATUS" >&2
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json >&2
                exit 1 ;;
            esac
          done
          echo "Timed out waiting for migration command" >&2
          exit 1

      - name: Write new image tag to the idle color's own parameter only
        run: |
          aws ssm put-parameter --name "${{ steps.colors.outputs.idle_image_tag_param }}" --type String --value "$IMAGE_TAG" --overwrite

      - name: Suspend the idle color's scaling policy before waking it up
        run: |
          # Target-tracking scaling reacts to ALBRequestCountPerTarget, which
          # is near-zero for the idle color right up until cutover (only the
          # header-preview smoke test hits it). Without this, the policy
          # scales the idle color straight back down to min_size=0 seconds
          # after the next step sets desired_capacity=2, and the idle color
          # never actually comes up. Resumed on whichever color ends up
          # active after cutover, a few steps down.
          aws autoscaling suspend-processes --auto-scaling-group-name "${{ steps.colors.outputs.idle_asg }}" --scaling-processes AlarmNotification

      - name: Scale the idle color up
        run: |
          # Scale to 0 first, then to 2 -- if the previous deploy attempt's
          # bake failed, this ASG was deliberately left at desired=2 (kept
          # warm for inspection), so a straight "set desired=2" would be a
          # no-op and the health-check/smoke-test below would validate those
          # already-running, previously-bad instances instead of the new
          # image tag just written above. Forcing 0 first guarantees fresh
          # instances boot with the current image tag every time. Harmless
          # no-op in the normal case (idle color already at 0).
          aws autoscaling update-auto-scaling-group --auto-scaling-group-name "${{ steps.colors.outputs.idle_asg }}" --min-size 0 --desired-capacity 0
          aws autoscaling update-auto-scaling-group --auto-scaling-group-name "${{ steps.colors.outputs.idle_asg }}" --min-size 0 --desired-capacity 2

      - name: Wait for the idle color's targets to pass health checks
        id: wait
        run: |
          set +e
          IDLE_TG_ARN=$(aws elbv2 describe-target-groups --names "${{ steps.colors.outputs.idle_tg_name }}" --query 'TargetGroups[0].TargetGroupArn' --output text)
          echo "idle_tg_arn=$IDLE_TG_ARN" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            HEALTHY=$(aws elbv2 describe-target-health --target-group-arn "$IDLE_TG_ARN" \
              --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" --output text)
            echo "healthy targets: $HEALTHY/2"
            if [ "$HEALTHY" -ge 2 ] 2>/dev/null; then
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "result=failed" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the idle color directly through the ALB (preview header)
        id: smoke
        if: steps.wait.outputs.result == 'success'
        run: |
          set +e
          for i in 1 2 3; do
            if curl -sk --max-time 5 -H "Host: ocar-api.clienttesting.in" -H "X-Deploy-Preview: ${{ steps.colors.outputs.idle }}" \
                 "https://$ALB_DNS_NAME/api/v1/geo/cities" | grep -q '"slug"'; then
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "result=failed" >> "$GITHUB_OUTPUT"

      - name: Roll back idle color on failed health-check/smoke-test (nothing user-facing ever changed)
        if: steps.wait.outputs.result != 'success' || steps.smoke.outputs.result != 'success'
        run: |
          echo "Idle color (${{ steps.colors.outputs.idle }}) failed to come up cleanly -- scaling it back down, active color was never touched." >&2
          aws autoscaling update-auto-scaling-group --auto-scaling-group-name "${{ steps.colors.outputs.idle_asg }}" --min-size 0 --desired-capacity 0
          exit 1

      - name: Flip the listener to the idle color
        id: flip
        if: steps.smoke.outputs.result == 'success'
        run: |
          set -e
          ALB_ARN=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].LoadBalancerArn' --output text)
          LISTENER_ARN=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --query "Listeners[?Port==\`443\`].ListenerArn | [0]" --output text)
          aws elbv2 modify-listener --listener-arn "$LISTENER_ARN" \
            --default-actions "Type=forward,TargetGroupArn=${{ steps.wait.outputs.idle_tg_arn }}"
          # Traffic is now on the idle color -- the SSM write below just
          # records that fact. If it fails after a real cutover, don't leave
          # active-color pointing at the wrong color for the NEXT deploy (it
          # would misidentify idle vs. live and needlessly cycle the
          # actually-live color). Retry a few times before giving up loudly.
          for i in 1 2 3 4 5; do
            if aws ssm put-parameter --name "$ACTIVE_COLOR_PARAM" --type String --value "${{ steps.colors.outputs.idle }}" --overwrite; then
              echo "Listener flipped: ${{ steps.colors.outputs.active }} -> ${{ steps.colors.outputs.idle }} is now live."
              exit 0
            fi
            sleep 3
          done
          echo "CRITICAL: listener flipped to ${{ steps.colors.outputs.idle }} but active-color SSM parameter update failed after retries." >&2
          echo "Manually run: aws ssm put-parameter --name $ACTIVE_COLOR_PARAM --type String --value ${{ steps.colors.outputs.idle }} --overwrite" >&2
          exit 1

      - name: Resume scaling on the new active color, suspend it on the old one
        if: steps.flip.conclusion == 'success'
        run: |
          # The color that just went live should scale normally with real
          # traffic again. The color that just went inactive must NOT let
          # its own target-tracking policy scale it down mid-bake -- it's
          # being kept warm on purpose for instant rollback (next step).
          aws autoscaling resume-processes --auto-scaling-group-name "${{ steps.colors.outputs.idle_asg }}" --scaling-processes AlarmNotification
          aws autoscaling suspend-processes --auto-scaling-group-name "${{ steps.colors.outputs.active_asg }}" --scaling-processes AlarmNotification

      - name: Bake period -- watch the new active color's error rate
        id: bake
        if: steps.flip.conclusion == 'success'
        run: |
          set +e
          ALB_ARN_SUFFIX=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].LoadBalancerArn' --output text | sed 's#.*loadbalancer/##')
          IDLE_TG_ARN_SUFFIX=$(echo "${{ steps.wait.outputs.idle_tg_arn }}" | sed 's#.*targetgroup/##')
          ITERATIONS=$((BAKE_SECONDS / BAKE_POLL_INTERVAL))
          for i in $(seq 1 "$ITERATIONS"); do
            sleep "$BAKE_POLL_INTERVAL"
            END=$(date -u +%Y-%m-%dT%H:%M:%S)
            START=$(date -u -d "-${BAKE_POLL_INTERVAL} seconds" +%Y-%m-%dT%H:%M:%S)
            ERRORS=$(aws cloudwatch get-metric-statistics --namespace AWS/ApplicationELB \
              --metric-name HTTPCode_Target_5XX_Count \
              --dimensions Name=LoadBalancer,Value="$ALB_ARN_SUFFIX" Name=TargetGroup,Value="$IDLE_TG_ARN_SUFFIX" \
              --start-time "${START}Z" --end-time "${END}Z" --period "$BAKE_POLL_INTERVAL" --statistics Sum \
              --query 'Datapoints[0].Sum' --output text)
            CW_STATUS=$?
            if [ "$CW_STATUS" -ne 0 ]; then
              # Fail closed, not open: a broken metrics query must not read
              # as "zero errors" -- that's exactly the bug that let this
              # bake window silently no-op regardless of real 5xx volume.
              echo "cloudwatch get-metric-statistics failed (exit $CW_STATUS) -- treating as a bake failure" >&2
              echo "result=failed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$ERRORS" = "None" ] && ERRORS=0
            ERRORS_INT=${ERRORS%.*}
            echo "bake check $i/$ITERATIONS: $ERRORS_INT 5xx in the last ${BAKE_POLL_INTERVAL}s"
            if [ "$ERRORS_INT" -gt "$MAX_5XX_PER_POLL" ] 2>/dev/null; then
              echo "result=failed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Bake failed -- flip back to the old color instantly
        if: steps.flip.conclusion == 'success' && steps.bake.outputs.result == 'failed'
        run: |
          ALB_ARN=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].LoadBalancerArn' --output text)
          LISTENER_ARN=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --query "Listeners[?Port==\`443\`].ListenerArn | [0]" --output text)
          OLD_TG_ARN=$(aws elbv2 describe-target-groups --names "${{ steps.colors.outputs.active_tg_name }}" --query 'TargetGroups[0].TargetGroupArn' --output text)
          aws elbv2 modify-listener --listener-arn "$LISTENER_ARN" --default-actions "Type=forward,TargetGroupArn=$OLD_TG_ARN"
          aws ssm put-parameter --name "$ACTIVE_COLOR_PARAM" --type String --value "${{ steps.colors.outputs.active }}" --overwrite
          # Swap the suspend/resume back too -- the pre-deploy color is live
          # again and should scale normally; the bad color goes back to
          # being kept warm-but-suspended in case someone wants to inspect
          # it before scaling it down by hand.
          aws autoscaling resume-processes --auto-scaling-group-name "${{ steps.colors.outputs.active_asg }}" --scaling-processes AlarmNotification
          echo "Rolled back to ${{ steps.colors.outputs.active }}. NOTE: any migrations $IMAGE_TAG applied are NOT reverted (forward-only) -- if the migration itself is the problem, fix forward, don't roll it back." >&2
          exit 1

      - name: Bake clean -- scale the old color down
        if: steps.flip.conclusion == 'success' && steps.bake.outputs.result == 'success'
        run: |
          aws autoscaling update-auto-scaling-group --auto-scaling-group-name "${{ steps.colors.outputs.active_asg }}" --min-size 0 --desired-capacity 0
          echo "Deploy complete. ${{ steps.colors.outputs.idle }} is live, ${{ steps.colors.outputs.active }} scaled to 0."

      - name: Cleanup if something failed before cutover
        if: failure() && steps.flip.outcome != 'success'
        run: |
          echo "Job failed before the listener flip -- best-effort cleanup of the idle color." >&2
          aws autoscaling resume-processes --auto-scaling-group-name "${{ steps.colors.outputs.idle_asg }}" --scaling-processes AlarmNotification || true
          aws autoscaling update-auto-scaling-group --auto-scaling-group-name "${{ steps.colors.outputs.idle_asg }}" --min-size 0 --desired-capacity 0 || true

      - name: Reconcile scaling state if the job died between flip and a clean bake verdict
        # The listener already flipped successfully (traffic is correctly on
        # the new color), but the job died before the "Bake period" step ever
        # produced a result -- most likely the "Resume scaling..." step above
        # failed partway through its two AWS calls, possibly leaving one ASG
        # resumed/suspended and the other not. steps.bake.outcome is
        # 'skipped' in that case (it never got a chance to run, since its own
        # `if:` is implicitly ANDed with success()); it's 'success' if bake
        # ran to completion (that step always exits 0 by design, using its
        # `result` output rather than its exit code to signal pass/fail) --
        # excluding both 'success' and 'failure' here is the general form of
        # "never got a clean verdict", so this doesn't double-fire alongside
        # "Bake failed -- flip back" (which only fires when bake actually ran
        # and reported result=failed) and doesn't fire when bake ran cleanly.
        if: failure() && steps.flip.outcome == 'success' && steps.bake.outcome != 'success' && steps.bake.outcome != 'failure'
        run: |
          echo "Job failed after the listener flip succeeded but before the bake step could produce a result. Traffic is correctly on the new color (${{ steps.colors.outputs.idle }}) -- NOT rolling back the listener. The failure most likely happened in the resume/suspend step, so scaling state may be inconsistent between the two ASGs. Reconciling defensively by re-running both calls (both are idempotent, safe to repeat): resuming AlarmNotification on the new active color (${{ steps.colors.outputs.idle_asg }}), suspending it on the new idle color (${{ steps.colors.outputs.active_asg }})." >&2
          aws autoscaling resume-processes --auto-scaling-group-name "${{ steps.colors.outputs.idle_asg }}" --scaling-processes AlarmNotification || true
          aws autoscaling suspend-processes --auto-scaling-group-name "${{ steps.colors.outputs.active_asg }}" --scaling-processes AlarmNotification || true
