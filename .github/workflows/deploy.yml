name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  # workflow_run doesn't support `on.paths:` filtering (push/pull_request only)
  # -- so this job does it by hand: diff the exact commit CI just validated
  # against its immediate parent (correct for both a squash-merge and a
  # regular merge commit -- HEAD^ is "main's tip right before this PR
  # landed" either way) and skip build/deploy entirely if nothing that
  # actually feeds the Docker image changed. Otherwise every merge, even a
  # docs/Terraform-only one, would rebuild the image and restart the whole
  # ASG for no reason -- confirmed live: an infra/**-only PR (adding a new
  # IAM role, no app code touched) still triggered a real deploy under an
  # earlier version of this filter that included `infra/` and
  # `docker-compose.prod.yml`. Neither ever reaches the image -- checked
  # api/Dockerfile directly: it only COPYs pnpm-lock.yaml/pnpm-workspace.yaml/
  # package.json and api/. infra/** and docker-compose.prod.yml changes are
  # applied by a completely separate, manual `terraform apply`, not by this
  # workflow at all. Known gap, not fixed here: a direct push of multiple
  # commits straight to main (no PR) only diffs against the last commit's
  # parent, not the whole batch -- doesn't match how this repo has actually
  # been used (every change goes through a PR merge), so not worth the extra
  # complexity of tracking a separate "last deployed SHA" until it's a real problem.
  changes:
    name: Detect relevant changes
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: filter
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^(api/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.github/workflows/deploy\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    name: Build & Push Docker Image
    needs: changes
    if: github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ocar-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ASG
    needs: [changes, build-push]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
      IMAGE_TAG_PARAM: /ocar/prod/image-tag
      ASG_NAME: ${{ vars.ASG_NAME }}
      ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Run migrations (new image, current instances still serving traffic)
        run: |
          set -e
          # api/entrypoint.sh also runs migrate.js on every container start, so
          # this ad-hoc run and each instance's own boot both invoke it -- safe
          # only because migrate.js is idempotent (skips already-applied files,
          # and pg_advisory_lock serializes concurrent runs). This run exists
          # solely to gate the rollout on migrations succeeding.
          docker run --rm \
            -e MIGRATION_DATABASE_URL="${{ secrets.MIGRATION_DATABASE_URL }}" \
            --entrypoint node \
            ghcr.io/${{ github.repository_owner }}/ocar-api:$IMAGE_TAG \
            dist/db/migrate.js

      - name: Record previous image tag (for rollback)
        id: previous
        run: |
          PREV=$(aws ssm get-parameter --name "$IMAGE_TAG_PARAM" --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Update image-tag parameter
        run: |
          aws ssm put-parameter --name "$IMAGE_TAG_PARAM" --type String --value "$IMAGE_TAG" --overwrite

      - name: Start instance refresh
        id: refresh
        run: |
          ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":100}' \
            --query 'InstanceRefreshId' --output text)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Wait for instance refresh to complete
        id: wait
        run: |
          set +e
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "${{ steps.refresh.outputs.id }}" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "status: $STATUS"
            if [ "$STATUS" = "Successful" ]; then
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "result=failed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "result=timeout" >> "$GITHUB_OUTPUT"

      - name: Health-check the ALB
        id: health
        if: steps.wait.outputs.result == 'success'
        run: |
          set +e
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -sk --max-time 5 -o /dev/null -w "%{http_code}" \
              -H "Host: ocar-api.clienttesting.in" "https://$ALB_DNS_NAME/health")
            if [ "$CODE" = "200" ]; then
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "result=failed" >> "$GITHUB_OUTPUT"

      - name: Smoke-test a real DB-backed route
        id: smoke
        if: steps.health.outputs.result == 'success'
        run: |
          set +e
          for i in 1 2 3; do
            if curl -sk --max-time 5 -H "Host: ocar-api.clienttesting.in" \
                 "https://$ALB_DNS_NAME/api/v1/geo/cities" | grep -q '"slug"'; then
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "result=failed" >> "$GITHUB_OUTPUT"

      - name: Roll back on failure
        if: steps.wait.outputs.result != 'success' || steps.health.outputs.result != 'success' || steps.smoke.outputs.result != 'success'
        run: |
          PREV="${{ steps.previous.outputs.tag }}"
          if [ -n "$PREV" ] && [ "$PREV" != "$IMAGE_TAG" ]; then
            echo "Rolling back image-tag parameter to $PREV"
            aws ssm put-parameter --name "$IMAGE_TAG_PARAM" --type String --value "$PREV" --overwrite
            aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$ASG_NAME" \
              --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":100}'
            echo "Rolled back. NOTE: any migrations $IMAGE_TAG applied are NOT reverted (forward-only migrations) -- if the migration itself is the problem, it must be fixed forward, not rolled back."
          else
            echo "No distinct previous tag found -- nothing to roll back to. Manual intervention required."
          fi
          exit 1
