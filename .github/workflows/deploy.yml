name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  # workflow_run doesn't support `on.paths:` filtering (push/pull_request only)
  # -- so this job does it by hand: diff the exact commit CI just validated
  # against the last commit THIS WORKFLOW successfully deployed (not just
  # HEAD^) and skip build/deploy entirely if nothing that actually feeds the
  # Docker image changed since then. Otherwise every merge, even a
  # docs/Terraform-only one, would rebuild the image and restart the whole
  # ASG for no reason -- confirmed live: an infra/**-only PR (adding a new
  # IAM role, no app code touched) still triggered a real deploy under an
  # earlier version of this filter that included `infra/` and
  # `docker-compose.prod.yml`. Neither ever reaches the image -- checked
  # api/Dockerfile directly: it only COPYs pnpm-lock.yaml/pnpm-workspace.yaml/
  # package.json and api/. infra/** and docker-compose.prod.yml changes are
  # applied by a completely separate, manual `terraform apply`, not by this
  # workflow at all.
  #
  # Diffing against the last deployed SHA (via the Deploy workflow's own run
  # history) instead of HEAD^ is what makes this correct for a direct push of
  # multiple commits straight to main, not just a single-commit PR merge --
  # confirmed live: a 6-commit direct push to main where only the LAST commit
  # was docs-only caused HEAD^..HEAD to see just that one commit and report
  # "nothing relevant", silently skipping build/deploy for 5 preceding
  # commits that touched api/. Falls back to HEAD^ only when no prior
  # successful Deploy run exists (first run ever).
  changes:
    name: Detect relevant changes
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_SHA=$(gh run list --workflow=deploy.yml --status=success --branch=main --limit=1 --json headSha --jq '.[0].headSha' 2>/dev/null || echo "")
          if [ -z "$PREV_SHA" ] || ! git cat-file -e "$PREV_SHA" 2>/dev/null; then
            BASE="HEAD^"
          else
            BASE="$PREV_SHA"
          fi
          echo "Diffing $BASE..HEAD"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(api/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.github/workflows/deploy\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    name: Build & Push Docker Image
    needs: changes
    if: github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ocar-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ASG
    needs: [changes, build-push]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
      IMAGE_TAG_PARAM: /ocar/prod/image-tag
      ASG_NAME: ${{ vars.ASG_NAME }}
      ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Find a running ASG instance
        id: instance
        run: |
          set -e
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:autoscaling:groupName,Values=$ASG_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "No running ASG instance found -- can't route the migration command anywhere" >&2
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Run migrations (new image, current instances still serving traffic)
        env:
          # ocar-prod-db is Terraform's stable "${project_name}-${environment}-db"
          # identifier (infra/terraform/rds.tf) -- not a secret, doesn't rotate,
          # safe to hardcode here same as it is throughout rds.tf itself.
          DB_INSTANCE_ID: ocar-prod-db
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          set -e
          # DB host/port/name/user/secret-ARN are all queried live from RDS at
          # deploy time instead of being copied into a hand-maintained SSM
          # parameter -- see docs/INCIDENT_2026-08-25_PROD_DB_AUTH_OUTAGE.md for
          # why a copied value (the old migration-database-url parameter) went
          # stale and caused an outage. None of these values are secrets; the
          # actual password is fetched by migrate.js itself, inside the
          # container, directly from Secrets Manager via the instance's IAM role
          # (iam.tf's rds_secret_read policy) -- nothing sensitive crosses into
          # this workflow at all.
          DB_INFO=$(aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE_ID" \
            --query "DBInstances[0].{Host:Endpoint.Address,Port:Endpoint.Port,Name:DBName,User:MasterUsername,SecretArn:MasterUserSecret.SecretArn}" \
            --output json)
          DB_HOST=$(echo "$DB_INFO" | jq -r .Host)
          DB_PORT=$(echo "$DB_INFO" | jq -r .Port)
          DB_NAME=$(echo "$DB_INFO" | jq -r .Name)
          DB_USER=$(echo "$DB_INFO" | jq -r .User)
          DB_SECRET_ARN=$(echo "$DB_INFO" | jq -r .SecretArn)

          # Routed through SSM to a live ASG instance instead of a `docker run`
          # on this GitHub-hosted runner -- RDS (infra/terraform/rds.tf) isn't
          # publicly reachable, only the EC2 instances' security group can
          # reach it. api/entrypoint.sh also runs migrate.js on every container
          # start, so this ad-hoc run and each instance's own boot both invoke
          # it -- safe only because migrate.js is idempotent (skips
          # already-applied files, pg_advisory_lock serializes concurrent
          # runs). This run exists solely to gate the rollout on migrations
          # succeeding. --name db_migrate keeps this container out of the
          # ocar_* naming convention cadvisor/Alloy filter on
          # (infra/alloy/config.alloy) -- without it, cadvisor picked up a
          # fresh randomly-named container on every deploy and permanently
          # inflated Grafana Cloud's active-series count (2026-08-19 incident).
          # --pull always: this instance has been running ocar-api:latest
          # continuously and already has an old copy of that mutable tag
          # cached locally -- `docker run` does not re-pull an image that
          # already exists locally under the same tag, so without this flag
          # the migration container silently ran stale, pre-this-deploy code
          # (confirmed via a real deploy failure: DB_SECRET_ARN correctly
          # reached the container's shell env, but migrate.js still hit the
          # OLD code's "DATABASE_URL environment variable is not set" error,
          # meaning it never saw the DB_SECRET_ARN branch added in this
          # deploy at all). Brand-new instances at boot don't have this
          # problem -- they have nothing cached yet, so entrypoint.sh's own
          # migrate.js run is unaffected.
          cat > /tmp/ssm-commands.json <<EOF
          {
            "commands": [
              "docker run --rm --pull always --name db_migrate -e DB_HOST=$DB_HOST -e DB_PORT=$DB_PORT -e DB_NAME=$DB_NAME -e DB_USER=$DB_USER -e DB_SECRET_ARN=$DB_SECRET_ARN -e AWS_REGION=$AWS_REGION --entrypoint node ghcr.io/${{ github.repository_owner }}/ocar-api:$IMAGE_TAG dist/db/migrate.js"
            ]
          }
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ocar-api migration for $IMAGE_TAG" \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' --output text)

          for i in $(seq 1 30); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success)
                echo "Migrations applied."
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Migration command failed with status $STATUS" >&2
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json >&2
                exit 1 ;;
            esac
          done
          echo "Timed out waiting for migration command" >&2
          exit 1

      - name: Record previous image tag (for rollback)
        id: previous
        run: |
          PREV=$(aws ssm get-parameter --name "$IMAGE_TAG_PARAM" --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Update image-tag parameter
        run: |
          aws ssm put-parameter --name "$IMAGE_TAG_PARAM" --type String --value "$IMAGE_TAG" --overwrite

      - name: Start instance refresh
        id: refresh
        run: |
          ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":100}' \
            --query 'InstanceRefreshId' --output text)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Wait for instance refresh to complete
        id: wait
        run: |
          set +e
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "${{ steps.refresh.outputs.id }}" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "status: $STATUS"
            if [ "$STATUS" = "Successful" ]; then
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "result=failed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "result=timeout" >> "$GITHUB_OUTPUT"

      - name: Health-check the ALB
        id: health
        if: steps.wait.outputs.result == 'success'
        run: |
          set +e
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -sk --max-time 5 -o /dev/null -w "%{http_code}" \
              -H "Host: ocar-api.clienttesting.in" "https://$ALB_DNS_NAME/health")
            if [ "$CODE" = "200" ]; then
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "result=failed" >> "$GITHUB_OUTPUT"

      - name: Smoke-test a real DB-backed route
        id: smoke
        if: steps.health.outputs.result == 'success'
        run: |
          set +e
          for i in 1 2 3; do
            if curl -sk --max-time 5 -H "Host: ocar-api.clienttesting.in" \
                 "https://$ALB_DNS_NAME/api/v1/geo/cities" | grep -q '"slug"'; then
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "result=failed" >> "$GITHUB_OUTPUT"

      - name: Roll back on failure
        if: steps.wait.outputs.result != 'success' || steps.health.outputs.result != 'success' || steps.smoke.outputs.result != 'success'
        run: |
          PREV="${{ steps.previous.outputs.tag }}"
          if [ -n "$PREV" ] && [ "$PREV" != "$IMAGE_TAG" ]; then
            echo "Rolling back image-tag parameter to $PREV"
            aws ssm put-parameter --name "$IMAGE_TAG_PARAM" --type String --value "$PREV" --overwrite
            aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$ASG_NAME" \
              --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":100}'
            echo "Rolled back. NOTE: any migrations $IMAGE_TAG applied are NOT reverted (forward-only migrations) -- if the migration itself is the problem, it must be fixed forward, not rolled back."
          else
            echo "No distinct previous tag found -- nothing to roll back to. Manual intervention required."
          fi
          exit 1
