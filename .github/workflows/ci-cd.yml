name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  typecheck-api:
    name: Typecheck API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ocar/api --config.dangerouslyAllowAllBuilds=true
      - run: pnpm --filter @ocar/api exec tsc --noEmit

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ocar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ocar/api --config.dangerouslyAllowAllBuilds=true

      - name: Create .env for migrations
        run: |
          cat > api/.env <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ocar_test
          REDIS_URL=redis://localhost:6379
          JWT_ACCESS_SECRET=test-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET=test-refresh-secret-at-least-32-chars
          JWT_ACCESS_EXPIRY=15m
          JWT_REFRESH_EXPIRY_USER=30d
          JWT_REFRESH_EXPIRY_ADMIN=24h
          TOTP_ENCRYPTION_KEY=abababababababababababababababababababababababababababababababab
          BANK_ACCOUNT_ENCRYPTION_KEY=abababababababababababababababababababababababababababababababab
          S3_BUCKET_NAME=test-bucket
          S3_REGION=ap-south-1
          S3_ACCESS_KEY=test-access-key
          S3_SECRET_KEY=test-secret-key
          EOF

      - name: Run migrations
        run: pnpm --filter @ocar/api migrate

      - name: Run tests
        run: pnpm --filter @ocar/api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ocar_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ocar_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY_USER: 30d
          JWT_REFRESH_EXPIRY_ADMIN: 24h
          TOTP_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
          BANK_ACCOUNT_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
          S3_BUCKET_NAME: test-bucket
          S3_REGION: ap-south-1
          S3_ACCESS_KEY: test-access-key
          S3_SECRET_KEY: test-secret-key

  typecheck-user:
    name: Typecheck User App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ocar/user
      - run: pnpm --filter @ocar/user exec tsc --noEmit

  typecheck-driver:
    name: Typecheck Driver App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ocar/driver
      - run: pnpm --filter @ocar/driver exec tsc --noEmit

  typecheck-admin:
    name: Typecheck Admin App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ocar/admin
      - run: pnpm --filter @ocar/admin exec tsc --noEmit

  build-push:
    name: Build & Push Docker Image
    needs: [lint, typecheck-api, test-api, typecheck-user, typecheck-driver, typecheck-admin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ocar-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -e
            cd /home/ubuntu/Ocar-monorepo

            echo "$GHCR_TOKEN" | docker login ghcr.io -u cardevelopment01-tech --password-stdin

            export GITHUB_REPOSITORY_OWNER=cardevelopment01-tech
            export IMAGE_TAG=$IMAGE_TAG

            PREVIOUS_TAG=$(docker inspect ocar_api --format '{{.Config.Image}}' 2>/dev/null | awk -F: '{print $NF}' || echo "")

            docker compose -f docker-compose.prod.yml pull api

            echo "Running migrations (new image, old container still serving traffic)..."
            docker run --rm --env-file .env.prod \
              --entrypoint node \
              ghcr.io/$GITHUB_REPOSITORY_OWNER/ocar-api:$IMAGE_TAG \
              dist/db/migrate.js

            echo "Migrations OK — cutting over to new image"
            docker compose -f docker-compose.prod.yml up -d --no-deps api

            echo "Health-checking new container..."
            HEALTHY=false
            for i in 1 2 3 4 5 6 7 8; do
              if docker exec ocar_api wget -qO- http://localhost:4000/health; then
                HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "New container failed health check after cutover."
              if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$IMAGE_TAG" ]; then
                echo "Rolling back container to previous image tag: $PREVIOUS_TAG"
                IMAGE_TAG=$PREVIOUS_TAG docker compose -f docker-compose.prod.yml up -d --no-deps api
                echo "Rolled back. NOTE: any migrations $IMAGE_TAG applied are NOT reverted (forward-only migrations) — if the migration itself is the problem, it must be fixed forward, not rolled back."
              else
                echo "No distinct previous tag found — nothing to roll back to. Manual intervention required."
              fi
              exit 1
            fi

            echo "Smoke-testing a real DB-backed route..."
            SMOKE_OK=false
            for i in 1 2 3; do
              if docker exec ocar_api wget -qO- http://localhost:4000/api/v1/geo/cities | grep -q '"success":true'; then
                SMOKE_OK=true
                break
              fi
              sleep 3
            done

            if [ "$SMOKE_OK" != "true" ]; then
              echo "Smoke test failed on /api/v1/geo/cities after cutover."
              if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$IMAGE_TAG" ]; then
                echo "Rolling back container to previous image tag: $PREVIOUS_TAG"
                IMAGE_TAG=$PREVIOUS_TAG docker compose -f docker-compose.prod.yml up -d --no-deps api
                echo "Rolled back. NOTE: any migrations $IMAGE_TAG applied are NOT reverted (forward-only migrations)."
              else
                echo "No distinct previous tag found — nothing to roll back to. Manual intervention required."
              fi
              exit 1
            fi

            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
