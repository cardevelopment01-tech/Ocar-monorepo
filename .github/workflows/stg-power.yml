name: Stg Power (pause / resume)

# Staging costs money only while it is running, so it sleeps nights and weekends (infra/scripts/stg-power.mjs):
#   resume 08:00 IST Mon-Fri   (cron is UTC: 02:30)
#   pause  21:00 IST Mon-Fri   (cron is UTC: 15:30). Friday's pause lasts until Monday 08:00.
# The Grafana mute window "stg-paused" (infra/terraform/observability/notifications.tf) matches these hours, so a sleeping
# stg does not trigger "Alloy heartbeat lost". Change both together.
#
# Switch the schedule off without a code change: set the repo variable STG_AUTO_POWER to "off" (a manual run still works).
# A push to develop deploys to stg; if stg is paused that deploy fails at the migration step. Run "resume" first, then re-run.
#
# Needs the repo variable STG_GHA_POWER_ROLE_ARN (Terraform output github_actions_power_role_arn of the stg apply).

on:
  schedule:
    - cron: "30 2 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: What to do with stg
        type: choice
        options: [status, pause, resume]
        required: true

permissions:
  id-token: write
  contents: read

# Same lock as the stg deploy job (deploy.yml: deploy-api-<env>), so a pause never lands in the middle of a deploy.
concurrency:
  group: deploy-api-stg
  cancel-in-progress: false

jobs:
  power:
    name: stg ${{ github.event_name == 'schedule' && (github.event.schedule == '30 2 * * 1-5' && 'resume' || 'pause') || github.event.inputs.action }}
    runs-on: ubuntu-latest
    # Scheduled runs honour the off switch; a person pressing the button does not.
    if: github.event_name != 'schedule' || vars.STG_AUTO_POWER != 'off'
    environment: stg
    steps:
      - uses: actions/checkout@v4

      - name: Decide the action
        id: act
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "30 2 * * 1-5" ]; then ACTION=resume; else ACTION=pause; fi
          else
            ACTION="${{ github.event.inputs.action }}"
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "stg: $ACTION"

      - name: Guard -- the power role variable must be set
        env:
          ROLE: ${{ vars.STG_GHA_POWER_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "STG_GHA_POWER_ROLE_ARN is not set (Terraform output github_actions_power_role_arn of the stg apply)" >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.STG_GHA_POWER_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run
        env:
          ACTION: ${{ steps.act.outputs.action }}
        run: |
          if [ "$ACTION" = "resume" ]; then node infra/scripts/stg-power.mjs resume --wait; else node infra/scripts/stg-power.mjs "$ACTION"; fi
