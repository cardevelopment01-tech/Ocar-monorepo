services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/ocar-api:${IMAGE_TAG:-latest}
    container_name: ocar_api
    restart: unless-stopped
    env_file: .env.prod
    networks:
      - ocar_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    container_name: ocar_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - ocar_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: ocar_alloy
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command: run --storage.path=/var/lib/alloy/data --server.http.listen-addr=127.0.0.1:12345 /etc/alloy/config.alloy
    networks:
      - ocar_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: ocar_node_exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - ocar_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  certbot_webroot:
  alloy_data:

networks:
  ocar_net:
    driver: bridge
