services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/ocar-api:${IMAGE_TAG:-latest}
    container_name: ocar_api
    restart: unless-stopped
    env_file: .env.prod
    # Published to the host so the ALB (no nginx in front on the new ASG
    # instances) can reach it directly. Harmless on the old box too --
    # nginx still routes internally via ocar_net regardless.
    ports:
      - "4000:4000"
    networks:
      - ocar_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    container_name: ocar_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - ocar_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: ocar_alloy
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command: run --storage.path=/var/lib/alloy/data --server.http.listen-addr=127.0.0.1:12345 /etc/alloy/config.alloy
    networks:
      - ocar_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: ocar_node_exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - ocar_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # pg_stat_statements collector is disabled by default upstream (expensive
  # on a busy server, one series per unique query) -- explicitly enabled here
  # since finding slow/unusual queries is the whole point of running this.
  # DATA_SOURCE_NAME (not DATABASE_URL, which is what .env.prod actually has)
  # is what the exporter reads -- the entrypoint override maps one to the
  # other rather than duplicating the connection string under a second name.
  # Runs on every instance identically: all instances share the same Neon DB,
  # so every instance's exporter reports the same pg_stat_statements numbers
  # -- harmless duplication (dashboard queries use max() not sum()), simpler
  # than standing up a dedicated instance just to avoid it.
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: ocar_postgres_exporter
    restart: unless-stopped
    env_file: .env.prod
    entrypoint: ["sh", "-c", "DATA_SOURCE_NAME=\"$$DATABASE_URL\" exec /bin/postgres_exporter --collector.stat_statements --collector.stat_statements.include_query"]
    networks:
      - ocar_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  certbot_webroot:
  alloy_data:

networks:
  ocar_net:
    driver: bridge
