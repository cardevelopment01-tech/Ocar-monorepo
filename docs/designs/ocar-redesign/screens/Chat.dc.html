<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat with driver</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0}
button,input{font-family:inherit}
.press{transition:transform .16s cubic-bezier(.3,.7,.3,1),background-color .2s ease,box-shadow .25s ease}
.press:active{transform:scale(.97)}
.hide-scroll{scrollbar-width:none}
.hide-scroll::-webkit-scrollbar{display:none}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.pop{animation:pop .35s cubic-bezier(.22,.9,.32,1) both}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6FBFB; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14171A">

<div style="position: absolute; top: 0; left: 0; right: 0; height: 128px; background: #FFFFFF; border-bottom: 1px solid rgba(20,23,26,0.07); box-shadow: 0 2px 12px rgba(20,23,26,0.04); padding: 56px 18px 0; display: flex; align-items: center; gap: 12px; z-index: 2">
<a href="Driver.dc.html" class="press" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #F7F6F1; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 10H4.5M9.5 4.8L4.3 10l5.2 5.2" stroke="#14171A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
</a>
<div style="width: 44px; height: 44px; border-radius: 22px; background: linear-gradient(145deg, #12A0B6, #0A7788); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 15px; font-weight: 700; flex-shrink: 0">RK</div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-size: 16px; font-weight: 700; margin-bottom: 2px">Ramesh Kumar</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #0A7788"><span style="width: 7px; height: 7px; border-radius: 4px; background: #1FA971"></span>Arriving in 4 min <span style="color: #8A9094; font-weight: 600">&middot; OD 02 AB 4821</span></div>
</div>
<button class="press" aria-label="Call driver" style="width: 44px; height: 44px; border-radius: 22px; background: #E8F4F6; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5.2 3.5h2.6l1.3 3.4-1.7 1.2a9.2 9.2 0 0 0 4.2 4.2l1.2-1.7 3.4 1.3v2.6a1.6 1.6 0 0 1-1.7 1.6A12.6 12.6 0 0 1 3.6 5.2 1.6 1.6 0 0 1 5.2 3.5z" stroke="#0A7788" stroke-width="1.5" stroke-linejoin="round"/></svg>
</button>
</div>

<div class="hide-scroll" style="position: absolute; top: 128px; left: 0; right: 0; bottom: 156px; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; justify-content: flex-end">

<div style="align-self: center; height: 26px; padding: 0 12px; border-radius: 13px; background: #E8EEEE; color: #5F6468; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; margin-bottom: 14px">Today</div>

<div style="align-self: center; max-width: 300px; text-align: center; font-size: 12.5px; line-height: 1.5; color: #6B7176; margin-bottom: 18px">Your number stays private. Messages are only for this ride.</div>

<sc-for list="{{messages}}" as="m" hint-placeholder-count="4">
<div class="pop" style="display: flex; flex-direction: column; align-items: {{m.align}}; margin-bottom: 10px">
<div style="max-width: 280px; padding: 11px 15px; background: {{m.bg}}; color: {{m.color}}; border: {{m.border}}; border-radius: {{m.radius}}; font-size: 14.5px; line-height: 1.45; font-weight: 500; box-shadow: {{m.shadow}}">{{m.text}}</div>
<div style="font-size: 11px; color: #8A9094; margin-top: 4px; padding: 0 4px">{{m.time}}</div>
</div>
</sc-for>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid rgba(20,23,26,0.07); padding: 12px 18px 28px; z-index: 2">
<div class="hide-scroll" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -18px 12px; padding: 0 18px">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
<button class="press" onClick="{{q.send}}" style="flex-shrink: 0; height: 40px; padding: 0 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid rgba(14,143,163,0.35); color: #0A7788; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap">{{q.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div style="flex-grow: 1; height: 52px; border-radius: 26px; background: #F7F6F1; border: 1px solid rgba(20,23,26,0.06); padding: 0 20px; display: flex; align-items: center; font-size: 14.5px; color: #8A9094">Message Ramesh</div>
<button class="press" aria-label="Send" style="width: 52px; height: 52px; border-radius: 26px; background: #0B8296; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 18px rgba(14,143,163,0.28); flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.4 10L16.6 3.6 12.4 16.4 9.6 11 3.4 10z" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const sent = s.sent || [];
    const base = [
      { from: 'driver', text: 'Hello, this is Ramesh. I have accepted your ride and I am on my way.', time: '6:12 PM' },
      { from: 'me', text: 'Great, thank you. I will be at the main gate.', time: '6:12 PM' },
      { from: 'driver', text: 'Understood. I will reach in about 4 minutes in a white sedan.', time: '6:13 PM' }
    ];
    const all = base.concat(sent.map((t) => ({ from: 'me', text: t, time: 'Just now' })));
    const messages = all.map((m) => {
      const me = m.from === 'me';
      return {
        text: m.text, time: m.time,
        align: me ? 'flex-end' : 'flex-start',
        bg: me ? '#0B8296' : '#FFFFFF',
        color: me ? '#FFFFFF' : '#14171A',
        border: me ? '1px solid #0B8296' : '1px solid rgba(20,23,26,0.07)',
        radius: me ? '20px 20px 6px 20px' : '20px 20px 20px 6px',
        shadow: me ? '0 6px 14px rgba(14,143,163,0.20)' : '0 2px 8px rgba(20,23,26,0.05)'
      };
    });
    const labels = ['I am at the gate', 'Please wait 2 minutes', 'Call me please', 'Thank you'];
    const quick = labels.map((label) => ({
      label,
      send: () => this.setState({ sent: sent.concat([label]) })
    }));
    return { messages, quick };
  }
}
</script>
</body>
</html>
