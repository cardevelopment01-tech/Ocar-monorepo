<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan your trip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0}
button,input{font-family:inherit}
.press{transition:transform .16s cubic-bezier(.3,.7,.3,1),background-color .16s ease,box-shadow .2s ease}
.press:active{transform:scale(.97)}
.hide-scroll{scrollbar-width:none}
.hide-scroll::-webkit-scrollbar{display:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.25,1) both}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6FBFB; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14171A">

<div class="hide-scroll" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow-y: auto; padding: 56px 18px 140px">

<div style="display: flex; align-items: center; gap: 12px">
<button class="press" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.08); box-shadow: 0 2px 8px rgba(20,23,26,0.06); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 10H4.5M9.5 4.8L4.3 10l5.2 5.2" stroke="#14171A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<h1 style="flex-grow: 1; margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.2px">Plan your trip</h1>
<button class="press" style="height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.08); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #14171A; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="6.8" r="3.2" stroke="#14171A" stroke-width="1.6"/><path d="M3.8 16.6c.9-3 3.3-4.4 6.2-4.4s5.3 1.4 6.2 4.4" stroke="#14171A" stroke-width="1.6" stroke-linecap="round"/></svg>
For me
</button>
</div>

<div style="position: relative; margin-top: 22px; background: #FFFFFF; border: 1.5px solid #0B8296; border-radius: 20px; box-shadow: 0 0 0 4px rgba(14,143,163,0.10), 0 2px 8px rgba(20,23,26,0.06); padding: 4px 0">
<div style="position: absolute; left: 23px; top: 44px; height: 46px; border-left: 1.5px dashed #B3C0C3"></div>
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 70px 12px 18px; min-height: 62px">
<span style="width: 12px; height: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 6px; background: #0E8FA3; box-shadow: 0 0 0 4px rgba(14,143,163,0.16)"></span></span>
<div style="min-width: 0">
<div style="font-size: 11.5px; font-weight: 600; color: #6B7176; margin-bottom: 2px">Pickup</div>
<div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">FC project road, Byasanagar</div>
</div>
</div>
<div style="height: 1px; background: rgba(20,23,26,0.07); margin-left: 44px"></div>
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 70px 12px 18px; min-height: 62px">
<span style="width: 12px; height: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: #14171A"></span></span>
<div style="min-width: 0">
<div style="font-size: 11.5px; font-weight: 600; color: #0A7788; margin-bottom: 2px">Drop</div>
<div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{dest}}</div>
</div>
</div>
<button class="press" aria-label="Swap pickup and drop" style="position: absolute; right: 10px; top: 50%; margin-top: -22px; width: 44px; height: 44px; border-radius: 22px; background: #F2F6F6; border: 1px solid rgba(20,23,26,0.08); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 16V4.5M7 4.5L3.9 7.6M7 4.5l3.1 3.1M13 4v11.5M13 15.5l-3.1-3.1M13 15.5l3.1-3.1" stroke="#14171A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
</div>

<div class="hide-scroll" style="display: flex; gap: 8px; margin-top: 14px; overflow-x: auto">
<button class="press" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.10); display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #14171A; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.6 5.4l4.2-1.7 6.4 2.4 4.2-1.7v10.9l-4.2 1.7-6.4-2.4-4.2 1.7z" stroke="#0A7788" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.8 3.7v10.9M13.2 6.1V17" stroke="#0A7788" stroke-width="1.5"/></svg>
Select on map
</button>
<button class="press" onClick="{{pickHome}}" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.10); display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #14171A; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.6 9.2L10 3.8l6.4 5.4v6.6a.8.8 0 0 1-.8.8H12v-4.4H8v4.4H4.4a.8.8 0 0 1-.8-.8V9.2z" stroke="#14171A" stroke-width="1.5" stroke-linejoin="round"/></svg>
Home
</button>
<button class="press" onClick="{{pickWork}}" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.10); display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #14171A; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="6.4" width="14" height="10" rx="2.2" stroke="#14171A" stroke-width="1.5"/><path d="M7.4 6.4V5.2A1.2 1.2 0 0 1 8.6 4h2.8a1.2 1.2 0 0 1 1.2 1.2v1.2M3 10.6h14" stroke="#14171A" stroke-width="1.5" stroke-linecap="round"/></svg>
Work
</button>
</div>

<div style="font-size: 14px; font-weight: 600; color: #14171A; margin: 28px 2px 10px">Recent</div>
<div style="background: #FFFFFF; border: 1px solid rgba(20,23,26,0.07); border-radius: 20px; box-shadow: 0 2px 8px rgba(20,23,26,0.05); overflow: hidden">
<sc-for list="{{recents}}" as="r" hint-placeholder-count="3">
<button class="press" onClick="{{r.pick}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: transparent; border: none; border-top: {{r.bt}}; text-align: left; cursor: pointer; color: #14171A">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F4F5F1; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.2" stroke="#14171A" stroke-width="1.5"/><path d="M10 6.2V10.2L12.7 12.5" stroke="#14171A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-size: 15px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span>
<span style="display: block; font-size: 12.5px; color: #5F6468; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.s}}</span>
</span>
</button>
</sc-for>
</div>

<div style="font-size: 14px; font-weight: 600; color: #14171A; margin: 26px 2px 10px">Popular</div>
<div style="background: #FFFFFF; border: 1px solid rgba(20,23,26,0.07); border-radius: 20px; box-shadow: 0 2px 8px rgba(20,23,26,0.05); overflow: hidden">
<sc-for list="{{populars}}" as="p" hint-placeholder-count="3">
<button class="press" onClick="{{p.pick}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: transparent; border: none; border-top: {{p.bt}}; text-align: left; cursor: pointer; color: #14171A">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #E8F4F6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 17.2s5.2-4.7 5.2-8.8a5.2 5.2 0 0 0-10.4 0c0 4.1 5.2 8.8 5.2 8.8z" stroke="#0A7788" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="8.4" r="1.9" stroke="#0A7788" stroke-width="1.5"/></svg></span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-size: 15px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.t}}</span>
<span style="display: block; font-size: 12.5px; color: #5F6468; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.s}}</span>
</span>
<span style="flex-shrink: 0; font-size: 12.5px; font-weight: 600; color: #5F6468">{{p.d}}</span>
</button>
</sc-for>
</div>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(to top, #F6FBFB 52%, rgba(246,251,251,0)); pointer-events: none"></div>
<a href="TripType.dc.html" class="press" style="position: absolute; left: 18px; right: 18px; bottom: 28px; height: 56px; border-radius: 18px; background: #0B8296; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-shadow: 0 12px 24px rgba(14,143,163,0.30), inset 0 1px 0 rgba(255,255,255,0.18)">
Continue
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 10H15.5M10.8 5.2L15.6 10l-4.8 4.8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const dest = s.dest || 'Triumph International Pvt Ltd, The Nexus Esplanade';
    const line = '1px solid rgba(20,23,26,0.07)';
    const pick = (t) => () => this.setState({ dest: t });
    const recents = [
      { t: 'Triumph International Pvt Ltd', s: 'The Nexus Esplanade, Rasulgarh' },
      { t: 'AIIMS', s: 'Sijua, Bhubaneswar' },
      { t: 'Bhubaneswar Airport', s: 'Bhubaneswar Airport, Bhubaneswar' }
    ].map((r, i) => ({ ...r, bt: i === 0 ? 'none' : line, pick: pick(r.t) }));
    const populars = [
      { t: 'Bhubaneswar Airport', s: 'Bhubaneswar Airport, Bhubaneswar', d: '4.8 km' },
      { t: 'Bhubaneswar Railway Stn', s: 'Bhubaneswar Junction', d: '3.2 km' },
      { t: 'AIIMS Bhubaneswar', s: 'Sijua, Patrapada', d: '7.1 km' }
    ].map((p, i) => ({ ...p, bt: i === 0 ? 'none' : line, pick: pick(p.t) }));
    return { dest, recents, populars, pickHome: pick('Home, Patia, Bhubaneswar'), pickWork: pick('Work, Infocity, Bhubaneswar') };
  }
}
</script>
</body>
</html>
