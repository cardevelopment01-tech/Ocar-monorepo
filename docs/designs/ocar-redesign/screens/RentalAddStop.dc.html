<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a stop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0}
button,input{font-family:inherit}
.press{transition:transform .16s cubic-bezier(.3,.7,.3,1),background-color .2s ease,border-color .2s ease,box-shadow .25s ease}
.press:active{transform:scale(.98)}
.hide-scroll{scrollbar-width:none}
.hide-scroll::-webkit-scrollbar{display:none}
.tabnum{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6FBFB; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14171A">

<div style="position: absolute; top: 0; left: 0; right: 0; padding: 56px 18px 0; background: #F6FBFB; z-index: 2">
<div style="display: flex; align-items: center; gap: 12px">
<a href="RentalStops.dc.html" class="press" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.08); box-shadow: 0 2px 8px rgba(20,23,26,0.06); display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 10H4.5M9.5 4.8L4.3 10l5.2 5.2" stroke="#14171A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
</a>
<div style="flex-grow: 1; min-width: 0">
<h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.2px">Add a stop</h1>
<div style="font-size: 13px; color: #5F6468; margin-top: 1px">Between pickup and drop</div>
</div>
<span class="tabnum" style="height: 32px; padding: 0 12px; border-radius: 16px; background: #E8F4F6; color: #0A7788; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; flex-shrink: 0">Stop 6 of 8</span>
</div>

<div onClick="{{toggleQuery}}" style="margin-top: 18px; height: 52px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #0B8296; box-shadow: 0 0 0 4px rgba(14,143,163,0.09); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; cursor: text">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="flex-shrink: 0"><circle cx="9" cy="9" r="5.6" stroke="#6B7176" stroke-width="1.7"/><path d="M13.2 13.2L17 17" stroke="#6B7176" stroke-width="1.7" stroke-linecap="round"/></svg>
<span style="flex-grow: 1; display: flex; align-items: center; min-width: 0">
<span style="font-size: 15px; font-weight: 600; color: #14171A">{{qText}}</span>
<span style="width: 1.5px; height: 20px; background: #0B8296; margin-left: 1px"></span>
<span style="font-size: 15px; color: #8A9094; margin-left: 2px; display: {{placeDisplay}}">Search for a stop</span>
</span>
<span style="display: {{clearDisplay}}; width: 36px; height: 36px; border-radius: 18px; background: #F4F5F1; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" stroke="#3C4247" stroke-width="1.9" stroke-linecap="round"/></svg></span>
</div>
</div>

<div class="hide-scroll" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow-y: auto; padding: 182px 18px 40px">

<!-- empty state -->
<div style="display: {{emptyDisplay}}">
<div style="display: flex; gap: 10px; overflow-x: auto" class="hide-scroll">
<a href="RentalStops.dc.html" class="press" style="flex-shrink: 0; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; background: #0B8296; color: #FFFFFF; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; text-decoration: none; box-shadow: 0 8px 18px rgba(14,143,163,0.24)">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 17.2s5.4-4.7 5.4-9a5.4 5.4 0 0 0-10.8 0c0 4.3 5.4 9 5.4 9z" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round"/><circle cx="10" cy="8.2" r="1.9" stroke="#FFFFFF" stroke-width="1.7"/></svg>
Select on map
</a>
<a href="RentalStops.dc.html" class="press" style="flex-shrink: 0; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.08); color: #14171A; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 9.2L10 3.8l6.5 5.4V16a.8.8 0 0 1-.8.8H4.3a.8.8 0 0 1-.8-.8V9.2z" stroke="#14171A" stroke-width="1.6" stroke-linejoin="round"/></svg>
Home
</a>
<a href="RentalStops.dc.html" class="press" style="flex-shrink: 0; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.08); color: #14171A; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="6.5" width="14" height="9.5" rx="2" stroke="#14171A" stroke-width="1.6"/><path d="M7.5 6.5V5a1.2 1.2 0 0 1 1.2-1.2h2.6A1.2 1.2 0 0 1 12.5 5v1.5" stroke="#14171A" stroke-width="1.6"/></svg>
Work
</a>
</div>

<div style="font-size: 14px; font-weight: 600; margin: 24px 2px 2px">Recent</div>
<sc-for list="{{recent}}" as="p" hint-placeholder-count="2">
<a href="RentalStops.dc.html" class="press" style="display: flex; align-items: center; gap: 14px; padding: 13px 2px; border-bottom: 1px solid rgba(20,23,26,0.07); text-decoration: none; color: #14171A">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #F4F5F1; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.2" stroke="#14171A" stroke-width="1.6"/><path d="M10 6v4.2l2.8 1.6" stroke="#14171A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
<span style="display: block; font-size: 13px; color: #5F6468; margin-top: 2px">{{p.sub}}</span>
</span>
</a>
</sc-for>

<div style="font-size: 14px; font-weight: 600; margin: 24px 2px 2px">Popular</div>
<sc-for list="{{popular}}" as="p" hint-placeholder-count="4">
<a href="RentalStops.dc.html" class="press" style="display: flex; align-items: center; gap: 14px; padding: 13px 2px; border-bottom: 1px solid rgba(20,23,26,0.07); text-decoration: none; color: #14171A">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #F4F5F1; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 17.2s5.4-4.7 5.4-9a5.4 5.4 0 0 0-10.8 0c0 4.3 5.4 9 5.4 9z" stroke="#14171A" stroke-width="1.6" stroke-linejoin="round"/><circle cx="10" cy="8.2" r="1.9" stroke="#14171A" stroke-width="1.6"/></svg>
</span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
<span style="display: block; font-size: 13px; color: #5F6468; margin-top: 2px">{{p.sub}}</span>
</span>
</a>
</sc-for>
</div>

<!-- results state -->
<div style="display: {{resultsDisplay}}">
<div style="font-size: 14px; font-weight: 600; margin: 0 2px 2px">Results</div>
<sc-for list="{{results}}" as="r" hint-placeholder-count="5">
<a href="RentalStops.dc.html" class="press" style="display: flex; align-items: center; gap: 14px; padding: 13px 2px; border-bottom: 1px solid rgba(20,23,26,0.07); text-decoration: none; color: #14171A">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #F4F5F1; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 17.2s5.4-4.7 5.4-9a5.4 5.4 0 0 0-10.8 0c0 4.3 5.4 9 5.4 9z" stroke="#14171A" stroke-width="1.6" stroke-linejoin="round"/><circle cx="10" cy="8.2" r="1.9" stroke="#14171A" stroke-width="1.6"/></svg>
</span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 800; color: #0A7788">{{r.hit}}</span>{{r.rest}}</span>
<span style="display: block; font-size: 13px; color: #5F6468; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
</span>
<span class="tabnum" style="font-size: 12.5px; font-weight: 600; color: #6B7176; flex-shrink: 0">{{r.away}}</span>
</a>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const q = (s.q || '').trim();
    const hasQ = q.length > 0;
    const RESULTS = [
      { name: 'Patia, Bhubaneswar', sub: 'Near KIIT University, Odisha', away: '2.1 km' },
      { name: 'Patia Big Bazaar', sub: 'Infocity Road, Patia', away: '2.6 km' },
      { name: 'Patrapada Railway Station', sub: 'Patrapada, Bhubaneswar', away: '7.8 km' },
      { name: 'Pathani Samanta Planetarium', sub: 'Surya Nagar, Bhubaneswar', away: '9.4 km' },
      { name: 'Pattamundai Road', sub: 'Kendrapara, Odisha', away: '62 km' }
    ];
    const results = RESULTS.map((r) => ({
      hit: r.name.slice(0, q.length), rest: r.name.slice(q.length), sub: r.sub, away: r.away
    }));
    return {
      qText: hasQ ? q.charAt(0).toUpperCase() + q.slice(1) : '',
      placeDisplay: hasQ ? 'none' : 'inline',
      clearDisplay: hasQ ? 'flex' : 'none',
      emptyDisplay: hasQ ? 'none' : 'block',
      resultsDisplay: hasQ ? 'block' : 'none',
      toggleQuery: () => this.setState({ q: hasQ ? '' : 'pat' }),
      results,
      recent: [
        { name: 'Esplanade One Mall', sub: 'Rasulgarh, Bhubaneswar' },
        { name: 'Master Canteen Square', sub: 'Station Road, Bhubaneswar' }
      ],
      popular: [
        { name: 'Cuttack City', sub: 'Cuttack, Odisha' },
        { name: 'Puri Railway Station', sub: 'Puri, Odisha' },
        { name: 'KIIT University', sub: 'Patia, Bhubaneswar' },
        { name: 'Jagannath Temple, Puri', sub: 'Grand Road, Puri' }
      ]
    };
  }
}
</script>
</body>
</html>
