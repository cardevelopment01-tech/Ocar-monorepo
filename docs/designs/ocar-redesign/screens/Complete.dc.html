<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0}
button,input{font-family:inherit}
.press{transition:transform .16s cubic-bezier(.3,.7,.3,1),background-color .2s ease,border-color .2s ease,box-shadow .25s ease}
.press:active{transform:scale(.96)}
.hide-scroll{scrollbar-width:none}
.hide-scroll::-webkit-scrollbar{display:none}
@keyframes badge{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.badge{animation:badge .6s cubic-bezier(.22,.9,.32,1) both}
.tabnum{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6FBFB; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14171A">

<div class="hide-scroll" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow-y: auto; padding: 58px 18px 140px">

<div style="display: flex; align-items: center; gap: 14px; margin: 0 2px">
<div class="badge" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: linear-gradient(145deg, #12A0B6, #0A7788); box-shadow: 0 0 0 6px rgba(14,143,163,0.12), 0 10px 20px rgba(14,143,163,0.26); display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M7 15.6l5.4 5.4L23 9.6" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div style="min-width: 0">
<h1 style="margin: 0 0 3px; font-size: 24px; font-weight: 800; letter-spacing: -0.6px">You have arrived</h1>
<div class="tabnum" style="font-size: 13px; color: #5F6468; font-weight: 500">18.4 km &middot; 34 min &middot; 6:52 PM</div>
</div>
</div>

<div style="position: relative; margin-top: 20px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.07); border-radius: 24px; box-shadow: 0 4px 16px rgba(20,23,26,0.06), inset 0 1px 0 rgba(255,255,255,0.9); overflow: hidden">

<div style="padding: 18px 18px 16px">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div>
<div style="font-size: 12px; font-weight: 600; color: #6B7176; margin-bottom: 6px">Total fare</div>
<div class="tabnum" style="font-size: 36px; font-weight: 800; letter-spacing: -1.2px; line-height: 1">&#8377;2,480</div>
</div>
<span style="height: 30px; padding: 0 12px 0 10px; border-radius: 15px; background: #E8F4F6; color: #0A7788; font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px">
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 7.4l2.8 2.8L11 4.4" stroke="#0A7788" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
Paid in cash
</span>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 10px 12px; background: #F7F6F1; border-radius: 14px">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #0E8FA3; flex-shrink: 0"></span>
<span style="font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">FC project road</span>
<svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="flex-shrink: 0"><path d="M4 10h12M11.5 5.5L16 10l-4.5 4.5" stroke="#8A9094" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="width: 8px; height: 8px; border-radius: 2px; background: #14171A; flex-shrink: 0"></span>
<span style="font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">Triumph International</span>
</div>
</div>

<div style="position: relative; height: 20px">
<div style="position: absolute; left: 14px; right: 14px; top: 9.5px; border-top: 1.5px dashed #DCE4E5"></div>
<div style="position: absolute; left: -10px; top: 0; width: 20px; height: 20px; border-radius: 10px; background: #F6FBFB; box-shadow: inset 0 0 0 1px rgba(20,23,26,0.07)"></div>
<div style="position: absolute; right: -10px; top: 0; width: 20px; height: 20px; border-radius: 10px; background: #F6FBFB; box-shadow: inset 0 0 0 1px rgba(20,23,26,0.07)"></div>
</div>

<div style="padding: 10px 18px 6px">
<div style="font-size: 12px; font-weight: 600; color: #6B7176; margin-bottom: 4px">Fare breakdown</div>
<sc-for list="{{fare}}" as="f" hint-placeholder-count="5">
<div style="display: flex; align-items: center; height: 36px; border-top: {{f.bt}}">
<span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: #14171A">{{f.label}}</span>
<span class="tabnum" style="font-size: 12.5px; color: #6B7176; font-weight: 500; text-align: right; margin-right: 14px">{{f.detail}}</span>
<span class="tabnum" style="width: 64px; text-align: right; font-size: 14px; font-weight: 700">{{f.amount}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; margin-top: 6px; background: #F7F6F1; border-top: 1px solid rgba(20,23,26,0.06)">
<span style="font-size: 14px; font-weight: 800">Total</span>
<span class="tabnum" style="font-size: 18px; font-weight: 800; letter-spacing: -0.3px">&#8377;2,480</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 18px">
<span class="tabnum" style="font-size: 12px; color: #8A9094; font-weight: 600">Trip ID OCR-248193</span>
<button class="press" style="display: inline-flex; align-items: center; gap: 6px; background: transparent; border: none; padding: 4px 0; font-size: 12.5px; font-weight: 700; color: #0A7788; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3.6v9M6.6 9.4L10 12.8l3.4-3.4M4.6 15.8h10.8" stroke="#0A7788" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
Get receipt
</button>
</div>

</div>

<div style="margin-top: 14px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.07); border-radius: 24px; box-shadow: 0 2px 8px rgba(20,23,26,0.05), inset 0 1px 0 rgba(255,255,255,0.9); padding: 16px 18px 18px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(145deg, #12A0B6, #0A7788); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 14px; font-weight: 700; flex-shrink: 0">RK</div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-size: 15px; font-weight: 700; margin-bottom: 1px">Rate Ramesh</div>
<div style="font-size: 12.5px; color: #5F6468">White Sedan &middot; OD 02 AB 4821</div>
</div>
<span style="font-size: 13.5px; font-weight: 700; color: #0A7788">{{ratingLabel}}</span>
</div>

<div style="display: flex; justify-content: space-between; margin: 12px 4px 4px">
<sc-for list="{{stars}}" as="st" hint-placeholder-count="5">
<button class="press" onClick="{{st.pick}}" aria-label="{{st.label}}" style="width: 56px; height: 48px; background: transparent; border: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="36" height="36" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.2l2.4 5 5.4.8-3.9 3.8.9 5.4L10 14.6l-4.8 2.6.9-5.4L2.2 8l5.4-.8L10 2.2z" fill="{{st.fill}}" stroke="{{st.stroke}}" stroke-width="0.8" stroke-linejoin="round"/></svg>
</button>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="5">
<button class="press" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="height: 34px; padding: 0 13px; border-radius: 17px; background: {{t.bg}}; border: 1px solid {{t.border}}; color: {{t.color}}; font-size: 12.5px; font-weight: 600; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>

<div style="height: 1px; background: rgba(20,23,26,0.07); margin: 16px 0 14px"></div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<div style="min-width: 0">
<div style="font-size: 14px; font-weight: 700; margin-bottom: 2px">Tip driver</div>
<div style="font-size: 12px; color: #5F6468">100% goes to Ramesh</div>
</div>
<div style="display: flex; gap: 3px; padding: 3px; background: #F4F5F1; border-radius: 14px; flex-shrink: 0">
<sc-for list="{{tips}}" as="tp" hint-placeholder-count="4">
<button class="press" onClick="{{tp.pick}}" aria-pressed="{{tp.pressed}}" style="min-width: 50px; height: 36px; padding: 0 9px; border-radius: 11px; background: {{tp.bg}}; border: none; box-shadow: {{tp.shadow}}; color: {{tp.color}}; font-size: 12.5px; font-weight: 700; cursor: pointer">{{tp.label}}</button>
</sc-for>
</div>
</div>
</div>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(to top, #F6FBFB 52%, rgba(246,251,251,0)); pointer-events: none"></div>
<a href="Main.dc.html" class="press" style="position: absolute; left: 18px; right: 18px; bottom: 28px; height: 56px; border-radius: 18px; background: #0B8296; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 12px 24px rgba(14,143,163,0.30), inset 0 1px 0 rgba(255,255,255,0.18)">{{cta}}</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const rating = s.rating == null ? 5 : s.rating;
    const tagsOn = s.tags || {};
    const tip = s.tip == null ? 0 : s.tip;
    const fmt = (n) => '₹' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const line = '1px solid rgba(20,23,26,0.06)';

    const fare = [
      ['Base fare', 'Includes pickup', 300],
      ['Distance', '18.4 km × ₹80', 1472],
      ['Time', '34 min × ₹12', 408],
      ['Toll', 'Highway toll', 60],
      ['Taxes and fees', 'GST included', 240]
    ].map((r, i) => ({ label: r[0], detail: r[1], amount: fmt(r[2]), bt: i === 0 ? 'none' : line }));

    const words = ['', 'Poor', 'Below average', 'Good', 'Great', 'Excellent'];
    const stars = [1, 2, 3, 4, 5].map((n) => ({
      label: n + (n === 1 ? ' star' : ' stars'),
      fill: n <= rating ? '#E2A93B' : '#E4EAEB',
      stroke: n <= rating ? '#D6A552' : '#D3DADB',
      pick: () => this.setState({ rating: n })
    }));

    const tagList = rating >= 4
      ? ['Clean car', 'Polite', 'Safe driving', 'On time', 'Smooth route']
      : ['Late arrival', 'Rash driving', 'Unclean car', 'Wrong route', 'Rude'];
    const tags = tagList.map((label) => {
      const on = !!tagsOn[label];
      return {
        label,
        pressed: on ? 'true' : 'false',
        bg: on ? '#E8F4F6' : '#FFFFFF',
        border: on ? '#0B8296' : 'rgba(20,23,26,0.14)',
        color: on ? '#0A7788' : '#3C4247',
        toggle: () => { const next = { ...tagsOn }; next[label] = !on; this.setState({ tags: next }); }
      };
    });

    const tips = [0, 20, 50, 100].map((v) => {
      const on = tip === v;
      return {
        label: v === 0 ? 'None' : fmt(v),
        pressed: on ? 'true' : 'false',
        bg: on ? '#0B8296' : 'transparent',
        shadow: on ? '0 4px 10px rgba(14,143,163,0.28)' : 'none',
        color: on ? '#FFFFFF' : '#3C4247',
        pick: () => this.setState({ tip: v })
      };
    });

    return {
      fare, stars, tags, tips,
      ratingLabel: words[rating],
      cta: tip > 0 ? 'Submit and tip ' + fmt(tip) : 'Submit rating'
    };
  }
}
</script>
</body>
</html>
