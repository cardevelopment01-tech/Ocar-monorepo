<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip type and fare</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0}
button,input{font-family:inherit}
.press{transition:transform .16s cubic-bezier(.3,.7,.3,1),background-color .2s ease,border-color .2s ease,box-shadow .25s ease}
.press:active{transform:scale(.985)}
.hide-scroll{scrollbar-width:none}
.hide-scroll::-webkit-scrollbar{display:none}
.fade{transition:opacity .25s ease,max-height .4s cubic-bezier(.22,.9,.32,1),margin .4s cubic-bezier(.22,.9,.32,1)}
.tabnum{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6FBFB; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14171A">

<div class="hide-scroll" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow-y: auto; padding: 56px 18px 150px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" class="press" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.08); box-shadow: 0 2px 8px rgba(20,23,26,0.06); display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 10H4.5M9.5 4.8L4.3 10l5.2 5.2" stroke="#14171A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
</a>
<h1 style="flex-grow: 1; margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.2px">Choose your trip</h1>
</div>

<div style="margin-top: 20px; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.07); border-radius: 20px; box-shadow: 0 2px 8px rgba(20,23,26,0.05), inset 0 1px 0 rgba(255,255,255,0.9); padding: 14px 16px; display: flex; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0">
<span style="width: 10px; height: 10px; border-radius: 5px; background: #0E8FA3; box-shadow: 0 0 0 3px rgba(14,143,163,0.16)"></span>
<span style="height: 14px; border-left: 1.5px dashed #B3C0C3"></span>
<span style="width: 9px; height: 9px; border-radius: 2.5px; background: #14171A"></span>
</div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">FC project road, Byasanagar</div>
<div style="font-size: 13.5px; font-weight: 600; margin-top: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Triumph International Pvt Ltd</div>
</div>
<div style="text-align: right; flex-shrink: 0">
<div class="tabnum" style="font-size: 14px; font-weight: 800">18.4 km</div>
<div class="tabnum" style="font-size: 12px; color: #5F6468; margin-top: 2px">about 34 min</div>
</div>
</div>

<div style="font-size: 14px; font-weight: 600; color: #14171A; margin: 26px 2px 14px">Select trip type</div>

<button class="press" onClick="{{pickOne}}" aria-pressed="{{oneOn}}" style="position: relative; display: block; width: 100%; padding: 16px; background: {{oneBg}}; border: 1.5px solid {{oneBorder}}; border-radius: 22px; box-shadow: {{oneShadow}}; text-align: left; cursor: pointer; color: #14171A">
<span style="display: flex; align-items: center; gap: 14px">
<span style="position: relative; width: 48px; height: 48px; flex-shrink: 0; border-radius: 15px; background: {{oneIconBg}}; display: flex; align-items: center; justify-content: center">
<svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15.5M13.5 6l6 6-6 6" stroke="{{oneIconInk}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="position: absolute; right: -5px; top: -5px; width: 20px; height: 20px; border-radius: 10px; background: #0B8296; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; opacity: {{oneTick}}"><svg width="10" height="10" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 7.4l2.8 2.8L11 4.4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
</span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-size: 16.5px; font-weight: 700; margin-bottom: 3px">One way</span>
<span style="display: block; font-size: 12.5px; color: #5F6468">A to B at one fixed fare</span>
</span>
<span style="text-align: right; flex-shrink: 0">
<span class="tabnum" style="display: block; font-size: 21px; font-weight: 800; letter-spacing: -0.4px">&#8377;2,480</span>
<span style="display: block; font-size: 11.5px; color: #6B7176; margin-top: 2px">incl. taxes</span>
</span>
</span>
<span style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; padding-top: 13px; border-top: 1px solid rgba(20,23,26,0.07)">
<span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #F4F5F1; color: #3C4247; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">Fixed fare</span>
<span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #F4F5F1; color: #3C4247; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">Pay on arrival</span>
</span>
</button>

<button class="press" onClick="{{pickRound}}" aria-pressed="{{roundOn}}" style="position: relative; display: block; width: 100%; margin-top: 18px; padding: 16px; background: {{roundBg}}; border: 1.5px solid {{roundBorder}}; border-radius: 22px; box-shadow: {{roundShadow}}; text-align: left; cursor: pointer; color: #14171A">
<span style="position: absolute; top: -12px; right: 18px; height: 24px; padding: 0 11px 0 8px; border-radius: 12px; background: linear-gradient(135deg, #F6DC9A, #D6A552); box-shadow: 0 6px 14px rgba(214,165,82,0.38), inset 0 1px 0 rgba(255,255,255,0.5); display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; color: #3E2A05">
<svg width="12" height="12" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.4l2.3 4.9 5.3.7-3.9 3.7 1 5.3L10 14.4l-4.7 2.6 1-5.3L2.4 8l5.3-.7L10 2.4z" fill="#3E2A05"/></svg>
Best fare
</span>
<span style="display: flex; align-items: center; gap: 14px">
<span style="position: relative; width: 48px; height: 48px; flex-shrink: 0; border-radius: 15px; background: {{roundIconBg}}; display: flex; align-items: center; justify-content: center">
<svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9h14.5M14.5 4.8L18.7 9l-4.2 4.2M20 15H5.5M9.5 10.8L5.3 15l4.2 4.2" stroke="{{roundIconInk}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="position: absolute; right: -5px; top: -5px; width: 20px; height: 20px; border-radius: 10px; background: #0B8296; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; opacity: {{roundTick}}"><svg width="10" height="10" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 7.4l2.8 2.8L11 4.4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
</span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-size: 16.5px; font-weight: 700; margin-bottom: 3px">Round trip</span>
<span style="display: block; font-size: 12.5px; color: #5F6468">Go, wait and return together</span>
</span>
<span style="text-align: right; flex-shrink: 0">
<span class="tabnum" style="display: block; font-size: 12px; color: #8A9094; text-decoration: line-through; margin: 8px 0 1px">&#8377;4,960</span>
<span class="tabnum" style="display: block; font-size: 21px; font-weight: 800; letter-spacing: -0.4px">&#8377;4,120</span>
</span>
</span>
<span style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; padding-top: 13px; border-top: 1px solid rgba(20,23,26,0.07)">
<span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #E8F4F6; color: #0A7788; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center">Save &#8377;840</span>
<span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #F4F5F1; color: #3C4247; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">2 hr wait included</span>
<span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #F4F5F1; color: #3C4247; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">Same driver</span>
</span>
</button>

<div class="fade" style="overflow: hidden; max-height: {{extraMax}}; opacity: {{extraOpacity}}; margin-top: {{extraMt}}">
<div style="display: flex; gap: 10px">
<div style="flex: 1; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.07); border-radius: 18px; box-shadow: 0 2px 8px rgba(20,23,26,0.05); padding: 12px 14px">
<div style="font-size: 11.5px; font-weight: 600; color: #6B7176; margin-bottom: 3px">Return on</div>
<div style="font-size: 14px; font-weight: 700">Tomorrow, 6:30 PM</div>
</div>
<div style="flex: 1; background: #FFFFFF; border: 1px solid rgba(20,23,26,0.07); border-radius: 18px; box-shadow: 0 2px 8px rgba(20,23,26,0.05); padding: 12px 14px">
<div style="font-size: 11.5px; font-weight: 600; color: #6B7176; margin-bottom: 3px">Driver waits</div>
<div style="font-size: 14px; font-weight: 700">2 hours</div>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; margin: 22px 4px 0">
<svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="flex-shrink: 0"><rect x="4.2" y="8.6" width="11.6" height="8" rx="2.2" stroke="#0A7788" stroke-width="1.6"/><path d="M7 8.6V6.4a3 3 0 0 1 6 0v2.2" stroke="#0A7788" stroke-width="1.6" stroke-linecap="round"/></svg>
<span style="font-size: 12.5px; line-height: 1.45; color: #5F6468">Fares are locked at booking. Tolls and taxes are included.</span>
</div>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(to top, #F6FBFB 52%, rgba(246,251,251,0)); pointer-events: none"></div>
<a href="Vehicles.dc.html" class="press" style="position: absolute; left: 18px; right: 18px; bottom: 28px; height: 56px; border-radius: 18px; background: #0B8296; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; box-shadow: 0 12px 24px rgba(14,143,163,0.30), inset 0 1px 0 rgba(255,255,255,0.18)">
{{cta}}
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 10H15.5M10.8 5.2L15.6 10l-4.8 4.8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const round = s.type === 'round';
    const one = !round;
    const on = {
      bg: '#F3FAFB', border: '#0B8296', shadow: '0 0 0 4px rgba(14,143,163,0.10), 0 2px 8px rgba(20,23,26,0.06)',
      iconBg: '#0B8296', iconInk: '#FFFFFF', tick: '1'
    };
    const off = {
      bg: '#FFFFFF', border: 'rgba(20,23,26,0.10)', shadow: '0 2px 8px rgba(20,23,26,0.05)',
      iconBg: '#F4F5F1', iconInk: '#14171A', tick: '0'
    };
    const a = one ? on : off;
    const b = round ? on : off;
    return {
      oneOn: one ? 'true' : 'false',
      roundOn: round ? 'true' : 'false',
      oneBg: a.bg, oneBorder: a.border, oneShadow: a.shadow, oneIconBg: a.iconBg, oneIconInk: a.iconInk, oneTick: a.tick,
      roundBg: b.bg, roundBorder: b.border, roundShadow: b.shadow, roundIconBg: b.iconBg, roundIconInk: b.iconInk, roundTick: b.tick,
      extraMax: round ? '90px' : '0px',
      extraOpacity: round ? '1' : '0',
      extraMt: round ? '12px' : '0px',
      cta: round ? 'See rides from ₹4,120' : 'See rides from ₹2,480',
      pickOne: () => this.setState({ type: 'one' }),
      pickRound: () => this.setState({ type: 'round' })
    };
  }
}
</script>
</body>
</html>
