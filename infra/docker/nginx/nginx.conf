# Phase 1 production config — NOT ACTIVE
# Apps run locally with pnpm dev during Phase 1 development.
# Activate this in Phase 2 when deploying to a server.

upstream api {
    server api:4000;
}

upstream user_app {
    server user:3000;
}

upstream driver_app {
    server driver:3001;
}

upstream admin_app {
    server admin:3002;
}

server {
    listen 80;
    server_name ocar.app;

    # API
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket
    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://api;
    }

    # User app (default)
    location / {
        proxy_pass http://user_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name driver.ocar.app;

    location / {
        proxy_pass http://driver_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name admin.ocar.app;

    location / {
        proxy_pass http://admin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
